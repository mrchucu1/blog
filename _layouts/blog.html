{% include navigation.html %}

<div class="container">
  <article class="post">
    <header>
      <h1 class="tech-heading">{{ page.title }}</h1>
      <div class="post-meta">
        <span>{{ page.date | date: "%b %d, %Y" }}</span>
        • <span>☕️ {{ content | reading_time }} read</span>
      </div>
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    {% include social-share.html %}
    {% include related-posts.html %}
  </article>

  {% include toc.html %}
</div>
